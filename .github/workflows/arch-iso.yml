name: Arch ISO
on:
  push:
    paths: ['arch/**', 'app/**', '.github/workflows/arch-iso.yml']
  pull_request:
    paths: ['arch/**', 'app/**', '.github/workflows/arch-iso.yml']
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lint scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck arch/build.sh arch/installer/odjezdy-install arch/pkg/odjezdy-board/odjezdy-board-run arch/test/smoke.sh
          node --test arch/test/
      - name: Build ISO
        run: arch/build.sh "$RUNNER_TEMP/out"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test (QEMU)
        run: |
          sudo apt-get install -y -qq qemu-system-x86
          # board needs network for departures but the screen is drawn without it; KVM is used when available
          SMOKE_KEEP="$RUNNER_TEMP/screen.png" arch/test/smoke.sh "$RUNNER_TEMP"/out/odjezdy-os-*.iso 90
      # archive: false -> the .iso itself is downloadable, not wrapped in a .zip
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/out/*.iso
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/screen.png
          archive: false
