# Builds the Odjezdy OS ISO and the app update bundle, and publishes them as a GitHub Release.
#
#   git tag v0.5.0 && git push origin v0.5.0      -> release "v0.5.0"
#   Actions -> Release -> Run workflow (version)   -> same, without tagging by hand
#
# Running boards check releases/latest and offer odjezdy-app.tar.gz as an update (app/updater.js).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v" (e.g. 0.5.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "bad version: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > app/VERSION

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: pip install pycdlib

      - name: Alpine downloads cache
        uses: actions/cache@v4
        with:
          path: alpine/cache
          key: alpine-cache-${{ hashFiles('alpine/build.js') }}

      - name: Syntax check
        run: |
          for f in app/*.js app/themes/*.js; do node --check "$f"; done
          node app/board.js --png /tmp/smoke.png --theme buse

      - name: App update bundle
        run: |
          mkdir -p dist
          tar -czf dist/odjezdy-app.tar.gz -C app .
          (cd dist && sha256sum odjezdy-app.tar.gz > odjezdy-app.tar.gz.sha256)

      - name: Build ISO (Alpine)
        run: |
          node alpine/build.js
          mv alpine/out/odjezdy-os.iso "dist/odjezdy-os-alpine-${{ steps.v.outputs.version }}-x86_64.iso"
          (cd dist && sha256sum *.iso > SHA256SUMS && cat odjezdy-app.tar.gz.sha256 >> SHA256SUMS)
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Odjezdy OS ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
