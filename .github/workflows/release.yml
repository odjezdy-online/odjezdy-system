# Builds the Odjezdy OS ISOs (Alpine and Arch) and the app update bundle, and publishes them as a GitHub Release.
#
#   change app/VERSION on main (e.g. 0.5.0)        -> tag v0.5.0 + release, automatically
#   git tag v0.5.0 && git push origin v0.5.0      -> same, by hand
#   Actions -> Release -> Run workflow             -> same for the current app/VERSION (or a given one)
# A version whose tag already exists is skipped, so re-runs and unrelated pushes do nothing.
#
# Running boards check releases/latest and offer odjezdy-app.tar.gz as an update (app/updater.js).
name: Release

on:
  push:
    branches: [main]
    paths: ['app/VERSION']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v" (empty = app/VERSION)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to see whether this version was already released

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = tag ] && V="${GITHUB_REF_NAME#v}"
          [ -z "$V" ] && V="$(tr -d '[:space:]' < app/VERSION)"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' || { echo "bad version: $V"; exit 1; }
          if [ "$GITHUB_REF_TYPE" != tag ] && git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already released, nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$V" > app/VERSION

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Tools
        if: steps.v.outputs.skip != 'true'
        run: pip install pycdlib

      - name: Alpine downloads cache
        if: steps.v.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: alpine/cache
          key: alpine-cache-${{ hashFiles('alpine/build.js') }}

      - name: Syntax check
        if: steps.v.outputs.skip != 'true'
        run: |
          for f in app/*.js app/themes/*.js; do node --check "$f"; done
          node app/board.js --png /tmp/smoke.png --theme buse

      - name: Native KMS helper (static: runs on Alpine and Arch, in the app bundle and in the Alpine ISO)
        if: steps.v.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libdrm-dev
          if gcc -O2 -Wall -static -o app/native/odjezdy-kms app/native/odjezdy-kms.c $(pkg-config --cflags --libs libdrm); then
            strip app/native/odjezdy-kms; ls -la app/native/odjezdy-kms
          else
            echo "::warning::static odjezdy-kms build failed, the release goes without it (single display / fbdev only)"
            rm -f app/native/odjezdy-kms
          fi

      - name: App update bundle
        if: steps.v.outputs.skip != 'true'
        run: |
          mkdir -p dist
          tar -czf dist/odjezdy-app.tar.gz -C app .
          (cd dist && sha256sum odjezdy-app.tar.gz > odjezdy-app.tar.gz.sha256)

      - name: Build ISO (Alpine)
        if: steps.v.outputs.skip != 'true'
        run: |
          node alpine/build.js
          mv alpine/out/odjezdy-os.iso "dist/odjezdy-os-alpine-${{ steps.v.outputs.version }}-x86_64.iso"

      - name: Build ISO (Arch)
        if: steps.v.outputs.skip != 'true'
        run: |
          arch/build.sh "$RUNNER_TEMP/arch-out"
          mv "$RUNNER_TEMP"/arch-out/odjezdy-os-*.iso "dist/odjezdy-os-arch-${{ steps.v.outputs.version }}-x86_64.iso"

      - name: Enable KVM
        if: steps.v.outputs.skip != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test (Arch ISO)
        if: steps.v.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
          arch/test/smoke.sh "dist/odjezdy-os-arch-${{ steps.v.outputs.version }}-x86_64.iso" 90

      - name: Checksums
        if: steps.v.outputs.skip != 'true'
        run: |
          (cd dist && sha256sum *.iso > SHA256SUMS && cat odjezdy-app.tar.gz.sha256 >> SHA256SUMS)
          ls -la dist

      - name: Release notes
        if: steps.v.outputs.skip != 'true'
        run: |
          # human notes from CHANGELOG.md ("## <version>" section); the board shows them on its update screen
          awk -v h="## ${{ steps.v.outputs.version }}" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d' > notes.md
          [ -s notes.md ] || echo "Odjezdy OS ${{ steps.v.outputs.version }}" > notes.md
          cat notes.md

      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Odjezdy OS ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: false
          files: dist/*
